<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vendas e estoque</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f5bff">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap">
<style>
:root{--bg:#f2f4f7;--card:#fff;--ink:#14213d;--mut:#5d6b82;--line:#dde2ea;--acc:#2f5bff;--acc-ink:#fff;--ok:#16794a;--low:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#0f1624;--card:#18223a;--ink:#eef2fb;--mut:#9aa7c2;--line:#2a3756;--acc:#6f8cff;--acc-ink:#0f1624;--ok:#5fd39b;--low:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Archivo,system-ui,sans-serif}
header{position:sticky;top:0;background:var(--bg);padding:14px 16px 8px;z-index:5}
h1{margin:0 0 10px;font-size:22px;font-weight:800}
.tabs,.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px;border-radius:10px;white-space:nowrap}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
button.go{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
button:disabled{opacity:.4;cursor:not-allowed}
main{padding:8px 16px 40px;max-width:640px;margin:0 auto}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.row .nm{flex:1;min-width:0}.row b{display:block;font-weight:600}
.est{font-size:14px;color:var(--ok)}.est.low{color:var(--low)}
.pr{font-weight:800}
h2{font-size:15px;margin:18px 0 8px;color:var(--mut);font-weight:600}
.sum{color:var(--ink);font-weight:800}
input,select{font:inherit;width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);width:min(92vw,420px);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.5)}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.qty{display:flex;align-items:center;gap:14px;margin:10px 0}.qty span{font-size:22px;font-weight:800;min-width:30px;text-align:center}
.tot{font-size:24px;font-weight:800;margin:10px 0}
.msg{color:var(--low);min-height:20px}
.empty{color:var(--mut);padding:20px 0}
.ver{text-align:center;color:var(--mut);font-size:12px;padding:0 0 24px}
</style>
</head>
<body>
<header>
  <h1>Vendas e estoque</h1>
  <div class="tabs" id="tabs"></div>
</header>
<main id="app"><p class="empty">Carregando…</p></main>
<footer class="ver">versão 4b</footer>
<dialog id="dlg"></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ====== COLE AQUI os dados do seu projeto Supabase (Settings > API) ======
const SUPABASE_URL = "https://srlglmytvfulylxeyquw.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNybGdsbXl0dmZ1bHlseGV5cXV3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1OTIyMzAsImV4cCI6MjEwODE2ODIzMH0.-TEgRy4DsGEZGpB-nxY3S2_fLKAwWgzcGu5f_p2hE64";
// =========================================================================

const PAGAMENTOS = ["Pix maquininha","Pix direto (Leo)","Crédito","Débito"];
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const brl = n => Number(n).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtData = iso => new Date(iso).toLocaleString("pt-BR",{timeZone:"America/Sao_Paulo",day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
const dia = iso => new Date(iso).toLocaleDateString("pt-BR",{timeZone:"America/Sao_Paulo"});

let cats=[], prods=[], vendas=[], view="vender", catId=null, senha=null, filtroPg="todos";

async function load(){
  const [c,p,v] = await Promise.all([
    db.from("categorias").select("*").order("nome"),
    db.from("produtos").select("*").eq("ativo",true).order("nome"),
    db.from("vendas").select("*").order("criado_em",{ascending:false}).limit(500)
  ]);
  if(c.error||p.error||v.error){
    const er=c.error||p.error||v.error;
    $("app").innerHTML=`<p class="msg">Não conectou ao Supabase.</p><p class="est" style="color:var(--mut)">Motivo: ${esc(er.message||er.code||"sem resposta (internet ou projeto pausado)")}</p>`;return;
  }
  cats=c.data; prods=p.data; vendas=v.data;
  if(!catId || !cats.some(x=>x.id===catId)) catId = cats[0]?.id;
  render();
}

function render(){
  $("tabs").innerHTML = [["vender","Vender"],["historico","Histórico"],["gerenciar","Gerenciar"]]
    .map(([k,t])=>`<button class="${view===k?"on":""}" data-view="${k}">${t}</button>`).join("");
  $("app").innerHTML = view==="vender"?vVender():view==="historico"?vHistorico():vGerenciar();
}

function vVender(){
  const chips = cats.map(c=>`<button class="${c.id===catId?"on":""}" data-cat="${c.id}">${esc(c.nome)}</button>`).join("");
  const list = prods.filter(p=>p.categoria_id===catId).map(p=>`
    <div class="row">
      <div class="nm"><b>${esc(p.nome)}</b>
        <span class="est ${p.estoque<=2?"low":""}">${p.estoque>0?p.estoque+" em estoque":"Sem estoque"}</span></div>
      <div class="pr">${brl(p.preco)}</div>
      <button class="go" data-sell="${p.id}" ${p.estoque<1?"disabled":""}>Vender</button>
    </div>`).join("");
  return `<div class="chips">${chips}</div>${list||'<p class="empty">Nenhum produto nesta categoria. Adicione em Gerenciar.</p>'}`;
}

function vHistorico(){
  const filtros=[["todos","Todos"],["pix","Pix (todos)"],["Pix maquininha","Pix maquininha"],["Pix direto (Leo)","Pix direto (Leo)"],["Crédito","Crédito"],["Débito","Débito"]];
  const casa=(v,f)=>f==="todos"||(f==="pix"?v.forma_pagamento.startsWith("Pix"):v.forma_pagamento===f);
  const soma=l=>l.reduce((s,v)=>s+Number(v.valor_total),0);
  const chips=filtros.map(([k,t])=>`<button class="${filtroPg===k?"on":""}" data-fpg="${k}">${t}</button>`).join("");
  const lista=vendas.filter(v=>casa(v,filtroPg));
  const topo=`<div class="chips">${chips}</div>
    <div class="row"><div class="nm"><b>Total (${lista.length} venda${lista.length===1?"":"s"})</b></div><div class="pr">${brl(soma(lista))}</div></div>`;
  if(!lista.length) return topo+'<p class="empty">Nenhuma venda nesse filtro.</p>';
  const grupos={};
  lista.forEach(v=>{(grupos[dia(v.criado_em)] ||= []).push(v)});
  return topo+Object.entries(grupos).map(([d,vs])=>`<h2>${d} — <span class="sum">${brl(soma(vs))}</span></h2>`+vs.map(v=>`
      <div class="row"><div class="nm"><b>${v.quantidade}× ${esc(v.produto_nome)}</b>
        <span class="est" style="color:var(--mut)">${fmtData(v.criado_em)} · ${esc(v.forma_pagamento)}</span></div>
        <div class="pr">${brl(v.valor_total)}</div><button data-delvenda="${v.id}">Excluir</button></div>`).join("")).join("");
}

function vGerenciar(){
  const opts = cats.map(c=>`<option value="${c.id}" ${c.id===catId?"selected":""}>${esc(c.nome)}</option>`).join("");
  const listaCats = cats.map(c=>{
    const n = prods.filter(p=>p.categoria_id===c.id).length;
    return `<div class="row"><div class="nm"><b>${esc(c.nome)}</b>
      <span class="est" style="color:var(--mut)">${n} produto(s)</span></div>
      <button data-delcat="${c.id}">Excluir</button></div>`}).join("");
  const list = prods.map(p=>`
    <div class="row"><div class="nm"><b>${esc(p.nome)}</b>
      <span class="est" style="color:var(--mut)">${esc(cats.find(c=>c.id===p.categoria_id)?.nome||"")} · ${p.estoque} un. · ${brl(p.preco)}</span></div>
      <button data-ajustar="${p.id}">Ajustar</button><button data-del="${p.id}">Excluir</button></div>`).join("");
  return `<h2>Novo produto</h2>
    <select id="n-cat">${opts}</select>
    <input id="n-nome" placeholder="Nome (ex: Barrinha integral)">
    <div class="grid"><input id="n-preco" type="number" step="0.01" inputmode="decimal" placeholder="Preço (R$)">
    <input id="n-est" type="number" inputmode="numeric" placeholder="Quantidade"></div>
    <button class="go" id="add-prod">Adicionar produto</button>
    <h2>Categorias</h2>
    <div class="grid"><input id="c-nome" placeholder="Nome da nova categoria"><button id="add-cat">Adicionar</button></div>
    ${listaCats}
    <h2>Produtos</h2>${list||'<p class="empty">Nada cadastrado.</p>'}`;
}

function pedirSenha(depois, texto="Digite a senha para gerenciar."){
  const d=$("dlg");
  d.innerHTML=`<b style="font-size:18px">Área protegida</b>
    <p class="est" style="color:var(--mut)">${esc(texto)}</p>
    <input id="pw" type="password" autocomplete="off" placeholder="Senha">
    <div class="msg" id="msg"></div>
    <div class="grid"><button id="cancela">Cancelar</button><button class="go" id="entrar">Entrar</button></div>`;
  const tentar=async()=>{
    const v=$("pw").value; $("entrar").disabled=true;
    const {error}=await db.rpc("checa_senha",{p_senha:v});
    if(error){
      $("msg").textContent = error.message.includes("Senha incorreta") ? "Senha incorreta." : "Erro: "+error.message;
      $("entrar").disabled=false; $("pw").select(); return;
    }
    senha=v; d.close(); depois();
  };
  $("cancela").onclick=()=>d.close();
  $("entrar").onclick=tentar;
  $("pw").onkeydown=e=>{if(e.key==="Enter")tentar()};
  d.showModal(); $("pw").focus();
}

async function gerenciar(fn,args){
  const {error}=await db.rpc(fn,{p_senha:senha,...args});
  if(error){
    alert(error.message);
    if(error.message.includes("Senha")){senha=null;view="vender";render()}
    return false;
  }
  await load(); return true;
}

function abrirVenda(id){
  const p = prods.find(x=>x.id===id); let q=1, pg=PAGAMENTOS[0];
  const d=$("dlg");
  const draw=()=>{
    d.innerHTML=`<b style="font-size:18px">${esc(p.nome)}</b>
      <div class="est">${p.estoque} em estoque · ${brl(p.preco)} cada</div>
      <div class="qty"><button id="q-">−</button><span>${q}</span><button id="q+">+</button></div>
      <div class="pay">${PAGAMENTOS.map(x=>`<button class="${x===pg?"on":""}" data-pg="${x}">${x}</button>`).join("")}</div>
      <div class="tot">${brl(p.preco*q)}</div><div class="msg" id="msg"></div>
      <div class="grid"><button id="cancela">Cancelar</button><button class="go" id="ok">Finalizar venda</button></div>`;
    $("q-").onclick=()=>{q=Math.max(1,q-1);draw()};
    $("q+").onclick=()=>{q=Math.min(p.estoque,q+1);draw()};
    d.querySelectorAll("[data-pg]").forEach(b=>b.onclick=()=>{pg=b.dataset.pg;draw()});
    $("cancela").onclick=()=>d.close();
    $("ok").onclick=async()=>{
      $("ok").disabled=true;
      const {data,error}=await db.rpc("registrar_venda",{p_produto:p.id,p_qtd:q,p_pagamento:pg});
      if(error){$("msg").textContent=error.message;$("ok").disabled=false;return}
      d.innerHTML=`<b style="font-size:18px">Venda registrada</b>
        <p>${q}× ${esc(p.nome)}<br>${brl(data.valor_total)} · ${esc(pg)}<br>${fmtData(data.criado_em)}</p>
        <button class="go" id="fecha" style="width:100%">Fechar</button>`;
      $("fecha").onclick=()=>d.close(); load();
    };
  };
  draw(); d.showModal();
}

document.addEventListener("click", async e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.dataset.view){
    if(t.dataset.view==="gerenciar" && view!=="gerenciar") return pedirSenha(()=>{view="gerenciar";render()});
    if(t.dataset.view!=="gerenciar") senha=null;
    view=t.dataset.view; render();
  }
  else if(t.dataset.fpg){filtroPg=t.dataset.fpg;render()}
  else if(t.dataset.cat){catId=t.dataset.cat;render()}
  else if(t.dataset.sell) abrirVenda(t.dataset.sell);
  else if(t.dataset.delvenda){
    const v=vendas.find(x=>x.id===t.dataset.delvenda);
    pedirSenha(async()=>{
      await gerenciar("g_excluir_venda",{p_id:v.id});
      if(view!=="gerenciar") senha=null;
    }, `Excluir a venda de ${v.quantidade}× ${v.produto_nome} (${brl(v.valor_total)})? As unidades voltam para o estoque. Digite a senha:`);
  }
  else if(t.dataset.ajustar){
    const n=parseInt(prompt("Quanto mudar no estoque?\nDigite 5 para adicionar 5, ou -3 para tirar 3."),10);
    if(n) await gerenciar("g_ajustar_estoque",{p_id:t.dataset.ajustar,p_delta:n});
  }
  else if(t.dataset.del){
    if(confirm("Excluir este produto da lista? O histórico de vendas continua salvo."))
      await gerenciar("g_remover_produto",{p_id:t.dataset.del});
  }
  else if(t.dataset.delcat){
    const c=cats.find(x=>x.id===t.dataset.delcat);
    const n=prods.filter(p=>p.categoria_id===c.id).length;
    if(confirm(`Excluir a categoria "${c.nome}" e os ${n} produto(s) dentro dela? O histórico de vendas continua salvo.`))
      await gerenciar("g_remover_categoria",{p_id:c.id});
  }
  else if(t.id==="add-prod"){
    const nome=$("n-nome").value.trim(); if(!nome) return alert("Digite o nome do produto.");
    catId=$("n-cat").value;
    await gerenciar("g_add_produto",{p_cat:catId,p_nome:nome,
      p_preco:parseFloat($("n-preco").value)||0,p_est:parseInt($("n-est").value,10)||0});
  }
  else if(t.id==="add-cat"){
    const nome=$("c-nome").value.trim(); if(!nome) return;
    await gerenciar("g_add_categoria",{p_nome:nome});
  }
});

if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js",{updateViaCache:"none"});
load();
</script>
</body>
</html>
